name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build worker
        run: npx esbuild src/index.ts --bundle --platform=neutral --format=esm --target=es2022 --outfile=worker.mjs

      - name: Deploy worker
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/ae693ae9f4faf8d8202a61970309f150/workers/scripts/telegram-games-bot" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -F "metadata={\"main_module\":\"worker.mjs\"};type=application/json" \
            -F "worker.mjs=@worker.mjs;type=application/javascript+module"

      - name: Upload secrets
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/ae693ae9f4faf8d8202a61970309f150/workers/scripts/telegram-games-bot/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"BOT_TOKEN\",\"text\":\"${{ secrets.BOT_TOKEN }}\",\"type\":\"secret_text\"}"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/ae693ae9f4faf8d8202a61970309f150/workers/scripts/telegram-games-bot/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"AI_API_ENDPOINT\",\"text\":\"${{ secrets.AI_API_ENDPOINT }}\",\"type\":\"secret_text\"}"

      - name: Setup webhook
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            --data "{\"url\":\"https://jqz.cc.cd/${{ secrets.BOT_TOKEN }}\",\"max_connections\":40,\"allowed_updates\":[\"message\",\"callback_query\"]}"

      - name: Setup route
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/f9fc37ed8ab79a8797141aaf9e1fe28b/workers/routes" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"pattern\":\"jqz.cc.cd/*\",\"script\":\"telegram-games-bot\"}"

      - name: Done
        run: echo "Bot deployed successfully!"