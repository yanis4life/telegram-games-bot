name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx esbuild src/index.ts --bundle --platform=neutral --format=esm --target=es2022 --outfile=worker.mjs

      - name: Deploy to Cloudflare
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/ae693ae9f4faf8d8202a61970309f150/workers/scripts/telegram-games-bot" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -F "metadata={\"main_module\":\"worker.mjs\",\"bindings\":[{\"name\":\"STORAGE\",\"type\":\"kv_namespace\",\"namespace_id\":\"59141780c4b04fad9073c210eae6bdd7\"},{\"name\":\"BOT_TOKEN\",\"type\":\"secret_text\",\"text\":\"${{ secrets.BOT_TOKEN }}\"},{\"name\":\"AI_API_ENDPOINT\",\"type\":\"secret_text\",\"text\":\"${{ secrets.AI_API_ENDPOINT }}\"},{\"name\":\"SUDO_USERS\",\"type\":\"plain_text\",\"text\":\"[7125289523]\"}]};type=application/json" \
            -F "worker.mjs=@worker.mjs;type=application/javascript+module"

      - name: Setup Telegram Webhook
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"https://jqz.cc.cd/${{ secrets.BOT_TOKEN }}\",\"max_connections\":40,\"allowed_updates\":[\"message\",\"callback_query\"]}"

      - name: Setup Worker Route
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/f9fc37ed8ab79a8797141aaf9e1fe28b/workers/routes" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"pattern\":\"jqz.cc.cd/*\",\"script\":\"telegram-games-bot\"}"