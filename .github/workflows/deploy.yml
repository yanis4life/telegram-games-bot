name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "ae693ae9f4faf8d8202a61970309f150"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}

      - name: Setup webhook
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            --data "{\"url\":\"https://jqz.cc.cd/${{ secrets.BOT_TOKEN }}\",\"max_connections\":40,\"allowed_updates\":[\"message\",\"callback_query\"]}"

      - name: Setup route
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/f9fc37ed8ab79a8797141aaf9e1fe28b/workers/routes" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"pattern\":\"jqz.cc.cd/*\",\"script\":\"telegram-games-bot\"}"

      - name: Done
        run: echo "Bot deployed!"