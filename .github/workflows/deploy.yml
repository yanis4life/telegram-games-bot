name: 🚀 Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build & Deploy Worker via Cloudflare API
        run: |
          set -e

          # Bundle TypeScript with esbuild (included in wrangler deps)
          echo "📍 Building worker..."
          npx esbuild src/index.ts --bundle --platform=neutral --format=esm --target=es2022 \
            --outfile=worker.mjs --external:*.html --external:*.css --external:node:* 2>&1 || {
            echo "⚠️ esbuild failed, trying wrangler build..."
            npx wrangler deploy --dry-run --outdir=dist 2>&1 || true
            if [ -f dist/index.js ]; then
              cp dist/index.js worker.mjs
            fi
          }

          if [ ! -f worker.mjs ]; then
            echo "❌ Build failed - no output file"
            exit 1
          fi

          echo "📍 Uploading worker (size: $(wc -c < worker.mjs) bytes)..."
          RESPONSE=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/ae693ae9f4faf8d8202a61970309f150/workers/scripts/telegram-games-bot" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -F "metadata={\"main_module\":\"worker.mjs\"};type=application/json" \
            -F "worker.mjs=@worker.mjs;type=application/javascript+module")

          echo "$RESPONSE" | python3 -c "
import sys, json
d = json.load(sys.stdin)
if d.get('success'):
    print('✅ Worker deployed successfully!')
    print('Script:', d['result'].get('id', 'telegram-games-bot'))
else:
    print('❌ Deployment failed:', d.get('errors', 'Unknown error'))
    sys.exit(1)
"

      - name: Upload Secrets
        run: |
          ACCOUNT_ID="ae693ae9f4faf8d8202a61970309f150"
          SCRIPT="telegram-games-bot"
          for secret in "BOT_TOKEN" "AI_API_ENDPOINT"; do
            VALUE=$(eval echo \$$secret)
            if [ -n "$VALUE" ]; then
              echo "📍 Uploading secret: $secret"
              curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT}/secrets" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                -H "Content-Type: application/json" \
                --data "{\"name\":\"$secret\",\"text\":\"$VALUE\"}"
            fi
          done
          echo "✅ Secrets uploaded"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}

      - name: Setup Telegram Webhook
        run: |
          WEBHOOK_URL="https://jqz.cc.cd/${{ secrets.BOT_TOKEN }}"
          echo "📍 Webhook: $WEBHOOK_URL"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            --data "{\"url\":\"$WEBHOOK_URL\",\"max_connections\":40,\"allowed_updates\":[\"message\",\"callback_query\"]}"
          sleep 2
          curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getWebhookInfo"

      - name: Setup Worker Route on Domain
        run: |
          echo "📍 Setting up route on jqz.cc.cd..."
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/f9fc37ed8ab79a8797141aaf9e1fe28b/workers/routes" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"pattern":"jqz.cc.cd/*","script":"telegram-games-bot"}' | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Route:', d.get('success',''))"

      - name: ✅ Deploy Complete
        run: |
          echo "========================"
          echo "✅ BOT DEPLOYED!"
          echo "========================"
          echo "🌐 URL: https://jqz.cc.cd"
          echo "🤖 Bot: https://t.me/games_robot"
          echo "📦 GitHub: https://github.com/yanis4life/telegram-games-bot"