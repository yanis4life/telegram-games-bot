name: 🚀 Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy & Webhook
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: "ae693ae9f4faf8d8202a61970309f150"
          secrets: |
            BOT_TOKEN
            AI_API_ENDPOINT
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}

      - name: Setup Telegram Webhook
        run: |
          WEBHOOK_URL="https://jqz.cc.cd/${{ secrets.BOT_TOKEN }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            --data "{\"url\":\"$WEBHOOK_URL\",\"max_connections\":40,\"allowed_updates\":[\"message\",\"callback_query\"]}"
          sleep 2
          curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getWebhookInfo"

      - name: Setup Worker Route on Domain
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/f9fc37ed8ab79a8797141aaf9e1fe28b/workers/routes" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"pattern":"jqz.cc.cd/*","script":"telegram-games-bot"}'

      - name: ✅ Deploy Complete
        run: |
          echo "✅ Bot deployed successfully!"
          echo "🌐 https://jqz.cc.cd"
          echo "🤖 https://t.me/games_robot"